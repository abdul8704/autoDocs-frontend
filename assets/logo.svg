<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Light-Mode Brand Gradient -->
    <linearGradient id="brandGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Light Document Plate Gradient -->
    <linearGradient id="plateGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Soft Ambient Elevation Shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>

    <!-- Accent Glow Filter -->
    <filter id="lightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Enlarged Main Elements (Scaled 1.38x, Background Removed) -->
  <g transform="translate(256, 256) scale(1.38) translate(-250, -267.5)">
    <!-- 1. The Architectural Markdown Sheet -->
    <g transform="translate(196, 120)" filter="url(#cardShadow)">
      <!-- Document Card Base -->
      <rect x="0" y="0" width="192" height="264" rx="18" fill="url(#plateGradLight)" stroke="#CBD5E1" stroke-width="2.5"/>

      <!-- Document Header / Code Block Bar -->
      <rect x="22" y="28" width="80" height="10" rx="5" fill="url(#brandGradLight)" />
      <circle cx="152" cy="33" r="4" fill="#94A3B8"/>
      <circle cx="166" cy="33" r="4" fill="#94A3B8"/>

      <!-- Markdown Section Dividers -->
      <rect x="22" y="58" width="148" height="6" rx="3" fill="#64748B"/>
      <rect x="22" y="74" width="116" height="6" rx="3" fill="#94A3B8"/>

      <!-- Structured Architecture Block -->
      <rect x="22" y="104" width="148" height="88" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2"/>

      <!-- Mini Mermaid Node Chart Inside Document -->
      <circle cx="48" cy="148" r="9" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5"/>
      <line x1="57" y1="148" x2="84" y2="148" stroke="#0284C7" stroke-width="2" stroke-dasharray="3 2"/>
      <rect x="84" y="137" width="22" height="22" rx="4" fill="#FFFFFF" stroke="#6366F1" stroke-width="2"/>
      <line x1="106" y1="148" x2="132" y2="148" stroke="#4F46E5" stroke-width="2"/>
      <circle cx="140" cy="148" r="8" fill="#4F46E5"/>

      <!-- Bottom Metadata Lines -->
      <rect x="22" y="214" width="136" height="6" rx="3" fill="#64748B" opacity="0.8"/>
      <rect x="22" y="228" width="72" height="6" rx="3" fill="#94A3B8" opacity="0.8"/>
    </g>

    <!-- 2. The Git Vector & Continuous Synchronization Flow -->
    <g>
      <!-- Commit Branch Spine -->
      <line x1="128" y1="150" x2="128" y2="358" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>

      <!-- Root Commit Node -->
      <circle cx="128" cy="358" r="14" fill="#FFFFFF" stroke="#64748B" stroke-width="5"/>
      <circle cx="128" cy="358" r="6" fill="#94A3B8"/>

      <!-- Continuous Reconciliation Path -->
      <path d="M 128 256
               C 128 200, 160 174, 218 174
               L 248 174"
            fill="none"
            stroke="url(#brandGradLight)"
            stroke-width="6"
            stroke-linecap="round"
            stroke-linejoin="round"/>

      <!-- Dynamic Webhook Commit Node (Active Trigger) -->
      <circle cx="128" cy="256" r="17" fill="#FFFFFF" stroke="#0284C7" stroke-width="5" filter="url(#lightGlow)"/>
      <circle cx="128" cy="256" r="7" fill="#2563EB"/>

      <!-- Synced Return Circuit -->
      <path d="M 330 384
               C 330 424, 210 428, 148 392"
            fill="none"
            stroke="url(#brandGradLight)"
            stroke-width="4"
            stroke-linecap="round"
            stroke-dasharray="7 5"/>

      <!-- Flow Arrowhead Returning to Main Branch -->
      <polygon points="144,385 158,390 152,401" fill="#0284C7"/>
    </g>

    <!-- Active Indicator Endpoint -->
    <circle cx="248" cy="174" r="4" fill="#0284C7"/>
  </g>
</svg>
