<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070A12"/>
    </linearGradient>

    <!-- Core Brand Cyan-to-Indigo Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Document Plate Gradient -->
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Accent Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Squircle App Canvas (GitHub App / Favicon standard) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="4"/>

  <!-- 2. Subtle Blueprint Grid Layer -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.35">
    <line x1="96" y1="64" x2="96" y2="448" />
    <line x1="160" y1="64" x2="160" y2="448" />
    <line x1="224" y1="64" x2="224" y2="448" />
    <line x1="288" y1="64" x2="288" y2="448" />
    <line x1="352" y1="64" x2="352" y2="448" />
    <line x1="416" y1="64" x2="416" y2="448" />

    <line x1="64" y1="96" x2="448" y2="96" />
    <line x1="64" y1="160" x2="448" y2="160" />
    <line x1="64" y1="224" x2="448" y2="224" />
    <line x1="64" y1="288" x2="448" y2="288" />
    <line x1="64" y1="352" x2="448" y2="352" />
    <line x1="64" y1="416" x2="448" y2="416" />
  </g>

  <!-- 3. Ambient Structural Bloom -->
  <circle cx="210" cy="240" r="100" fill="#00F0FF" opacity="0.06" filter="url(#softGlow)"/>
  <circle cx="330" cy="280" r="110" fill="#4F46E5" opacity="0.08" filter="url(#softGlow)"/>

  <!-- 4. The Architectural Markdown Sheet (Target Layer) -->
  <g transform="translate(196, 120)">
    <!-- Document Card Shadow & Base -->
    <rect x="0" y="0" width="192" height="264" rx="18" fill="url(#plateGrad)" stroke="#334155" stroke-width="3"/>

    <!-- Document Header / Code Block Bar -->
    <rect x="22" y="28" width="80" height="10" rx="5" fill="url(#brandGrad)" />
    <circle cx="152" cy="33" r="4" fill="#334155"/>
    <circle cx="166" cy="33" r="4" fill="#334155"/>

    <!-- Markdown Section Dividers (Lines) -->
    <rect x="22" y="58" width="148" height="6" rx="3" fill="#64748B" opacity="0.7"/>
    <rect x="22" y="74" width="116" height="6" rx="3" fill="#475569" opacity="0.6"/>

    <!-- Structured Architecture Block (Mermaid / Table Representation) -->
    <rect x="22" y="104" width="148" height="88" rx="10" fill="#090E17" stroke="#1E293B" stroke-width="2"/>

    <!-- Mini Mermaid Node Chart Inside Document -->
    <circle cx="48" cy="148" r="9" fill="none" stroke="#00F0FF" stroke-width="2.5"/>
    <line x1="57" y1="148" x2="84" y2="148" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3 2"/>
    <rect x="84" y="137" width="22" height="22" rx="4" fill="#1E293B" stroke="#818CF8" stroke-width="2"/>
    <line x1="106" y1="148" x2="132" y2="148" stroke="#4F46E5" stroke-width="2"/>
    <circle cx="140" cy="148" r="8" fill="#4F46E5"/>

    <!-- Bottom Metadata Lines -->
    <rect x="22" y="214" width="136" height="6" rx="3" fill="#475569" opacity="0.5"/>
    <rect x="22" y="228" width="72" height="6" rx="3" fill="#334155" opacity="0.6"/>
  </g>

  <!-- 5. The Git Vector & Continuous Synchronization Flow -->
  <g>
    <!-- Commit Branch Spine (Source of Truth) -->
    <line x1="128" y1="150" x2="128" y2="358" stroke="#334155" stroke-width="6" stroke-linecap="round"/>

    <!-- Root Commit Node -->
    <circle cx="128" cy="358" r="14" fill="#0B0F19" stroke="#475569" stroke-width="5"/>
    <circle cx="128" cy="358" r="6" fill="#64748B"/>

    <!-- Continuous Reconciliation Path (Branching from Commit -> Looping into Architecture Doc) -->
    <path d="M 128 256
             C 128 200, 160 174, 218 174
             L 248 174"
          fill="none"
          stroke="url(#brandGrad)"
          stroke-width="6"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#glow)"/>

    <!-- Dynamic Webhook Commit Node (Active Trigger) -->
    <circle cx="128" cy="256" r="17" fill="#070A12" stroke="#00F0FF" stroke-width="5" filter="url(#glow)"/>
    <circle cx="128" cy="256" r="7" fill="#F8FAFC"/>

    <!-- Synced Return Circuit (Doc -> Upstream Lineage Sync Loop) -->
    <path d="M 330 384
             C 330 424, 210 428, 148 392"
          fill="none"
          stroke="url(#brandGrad)"
          stroke-width="4"
          stroke-linecap="round"
          stroke-dasharray="7 5"
          opacity="0.85"/>

    <!-- Flow Arrowhead Returning to Main Branch -->
    <polygon points="144,385 158,390 152,401" fill="#00F0FF"/>
  </g>

  <!-- 6. Foreground Terminal Syntax Anchor -->
  <g transform="translate(198, 96)" filter="url(#glow)">
    <!-- Small Active Branch Pulse Dot -->
    <circle cx="50" cy="78" r="4" fill="#00F0FF"/>
  </g>
</svg>
