<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 120" width="100%" height="100%">
  <defs>
    <linearGradient id="wmBrand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- Mini Compact Glyphtag (48x48) -->
  <g transform="translate(16, 24)">
    <rect x="0" y="0" width="72" height="72" rx="18" fill="#0B0F19" stroke="#1E293B" stroke-width="2"/>
    <line x1="24" y1="20" x2="24" y2="52" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <circle cx="24" cy="48" r="4" fill="#64748B"/>
    <path d="M 24 32 C 24 24, 34 24, 42 24 L 52 24" fill="none" stroke="url(#wmBrand)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="24" cy="32" r="5" fill="#0B0F19" stroke="#00F0FF" stroke-width="3"/>
    <rect x="42" y="20" width="20" height="32" rx="3" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <line x1="46" y1="26" x2="56" y2="26" stroke="#00F0FF" stroke-width="1.5"/>
    <line x1="46" y1="32" x2="58" y2="32" stroke="#64748B" stroke-width="1.5"/>
    <line x1="46" y1="38" x2="52" y2="38" stroke="#64748B" stroke-width="1.5"/>
  </g>

  <!-- Typography: Product Name -->
  <g transform="translate(112, 70)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Geist', 'Inter', sans-serif" 
          font-weight="700" 
          font-size="36" 
          letter-spacing="-0.03em" 
          fill="#F8FAFC">
      AutoDocs<tspan fill="url(#wmBrand)">.engine</tspan>
    </text>
  </g>

  <!-- System Architecture Badge pill -->
  <g transform="translate(480, 46)">
    <rect x="0" y="0" width="168" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#00F0FF"/>
    <text x="26" y="18" 
          font-family="'JetBrains Mono', 'Geist Mono', monospace" 
          font-size="11" 
          font-weight="500" 
          letter-spacing="0.05em" 
          fill="#94A3B8">
      ARCHITECTURE.MD
    </text>
  </g>
</svg>
